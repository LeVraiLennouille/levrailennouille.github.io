<section class="CallToAction{% if include.variant %} {{ include.variant }}{% endif %}">
    <div class="CtaInner">
        {%- if include.badge %}
        <p class="CtaBadge"><span class="CtaBadgeDot" aria-hidden="true"></span>{{ include.badge }}</p>
        {%- endif %}
        <h2>{{ include.title }}{% if include.em %}<br><em>{{ include.em }}</em>{% endif %}</h2>
        <div class="CtaRow">
            <a href="{{ include.href1 }}" class="CtaBtn CursorHover">{{ include.label1 }}</a>
            {%- if include.label2 %}
            <a href="{{ include.href2 }}" class="CtaBtn Ghost CursorHover">{{ include.label2 }}</a>
            {%- endif %}
            <p class="CtaDesc">{{ include.text }}</p>
        </div>
    </div>
</section>
