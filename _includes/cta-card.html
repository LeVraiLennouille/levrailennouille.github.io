<section class="CallToAction{% if include.variant %} {{ include.variant }}{% endif %}">
    <div class="CtaCard">
        <div class="CtaCopy">
            {%- if include.badge %}
            <p class="CtaBadge"><span class="CtaBadgeDot" aria-hidden="true"></span>{{ include.badge }}</p>
            {%- endif %}
            <h2>{{ include.title }}{% if include.em %}<br><em>{{ include.em }}</em>{% endif %}</h2>
            <p class="CtaDesc">{{ include.text }}</p>
            <div class="CtaActions">
                <a href="{{ include.href1 }}" class="CtaBtn CursorHover">{{ include.label1 }}
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h12M9 3l5 5-5 5"/></svg></a>
                {%- if include.label2 %}
                <a href="{{ include.href2 }}" class="CtaLink CursorHover">{{ include.label2 }}
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10L10 2M4 2h6v6"/></svg></a>
                {%- endif %}
            </div>
        </div>
        {% include cta-art.html %}
    </div>
</section>
