<script>
(function () {
    try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    try {if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('HeroAnim');} catch (e) {}
})();
</script>
