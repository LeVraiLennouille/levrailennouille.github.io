{%- assign _avis = site.data.avis -%}
{%- if include.limit -%}
  {%- assign _avis = _avis | slice: 0, include.limit -%}
{%- endif -%}
{%- for a in _avis -%}
<div class="Card">
    <p class="QuoteText{% if a.placeholder %} Placeholder{% endif %}">{{ a.quote }}</p>
    <div class="Author">
        <div class="Avatar">{{ a.avatar }}</div>
        <div>
            <h3>{{ a.authorName }}</h3>
            <p>{{ a.authorRole }}</p>
        </div>
    </div>
</div>
{%- endfor -%}
