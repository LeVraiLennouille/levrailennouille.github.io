{% assign biz = site.data.business %}
{% assign type = page.schema_type | default: "WebPage" %}
{% assign clean_url = page.url | replace: ".html", "/" %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",

  {% if type == "Organization" %}
  "@type": "Organization",
  "name": "{{ biz.name }}",
  "legalName": "{{ biz.legal_name }}",
  "url": "{{ biz.url }}",
  "logo": "{{ biz.url }}{{ biz.logo }}",
  "description": "{{ page.description | default: biz.description | strip_html | strip_newlines }}",
  "email": "{{ biz.email }}",
  "sameAs": [
    {% for link in biz.social %}"{{ link }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ biz.address.locality }}",
    "addressCountry": "{{ biz.address.country }}"
  }

  {% elsif type == "CreativeWork" %}
  "@type": "CreativeWork",
  "name": "{{ page.title }}",
  "url": "{{ biz.url }}{{ page.url }}",
  "description": "{{ page.description | default: site.description | strip_html | strip_newlines }}",
  "creator": {
    "@type": "Organization",
    "name": "{{ biz.name }}",
    "url": "{{ biz.url }}"
  }
  {% if page.image %},
  "image": "{{ biz.url }}{{ page.image }}"
  {% endif %}
  {% if page.client %},
  "about": "{{ page.client }}"
  {% endif %}
  {% if page.date %},
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}"
  {% endif %}

  {% elsif type == "Service" %}
  "@type": "Service",
  "serviceType": "{{ page.title }}",
  "name": "{{ page.title }}",
  "url": "{{ biz.url }}{{ page.url }}",
  "description": "{{ page.description | default: site.description | strip_html | strip_newlines }}",
  "provider": {
    "@type": "Organization",
    "name": "{{ biz.name }}",
    "url": "{{ biz.url }}"
  }
  {% if page.price %},
  "offers": {
    "@type": "Offer",
    "price": "{{ page.price }}",
    "priceCurrency": "{{ page.currency | default: 'EUR' }}",
    "url": "{{ biz.url }}{{ page.url }}"
  }
  {% endif %}
  {% if page.area_served %},
  "areaServed": "{{ page.area_served }}"
  {% endif %}

  {% elsif type == "Product" %}
  "@type": "Product",
  "name": "{{ page.title }}",
  "url": "{{ biz.url }}{{ page.url }}",
  "description": "{{ page.description | default: site.description | strip_html | strip_newlines }}",
  {% if page.image %}"image": "{{ biz.url }}{{ page.image }}",{% endif %}
  "brand": {
    "@type": "Organization",
    "name": "{{ biz.name }}"
  }
  {% if page.price %},
  "offers": {
    "@type": "Offer",
    "price": "{{ page.price }}",
    "priceCurrency": "{{ page.currency | default: 'EUR' }}",
    "availability": "https://schema.org/{{ page.availability | default: 'InStock' }}",
    "url": "{{ biz.url }}{{ page.url }}"
  }
  {% endif %}

  {% elsif type == "Article" %}
  "@type": "Article",
  "headline": "{{ page.short_title | default: page.title }}",
  "name": "{{ page.title }}",
  "url": "{{ biz.url }}{{ clean_url }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ biz.url }}{{ clean_url }}"
  },
  "description": "{{ page.description | default: site.description | strip_html | strip_newlines }}",
  "inLanguage": "fr-FR",
  "articleSection": "{{ page.section }}",
  "image": "{{ biz.url }}{{ page.image | default: '/assets/og-preview.png' }}",
  "author": {
    "@type": "Person",
    "name": "{{ biz.founder_name }}",
    "url": "{{ biz.url }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ biz.name }}",
    "url": "{{ biz.url }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ biz.url }}{{ biz.logo }}"
    }
  },
  "isPartOf": {
    "@type": "WebSite",
    "name": "{{ biz.name }}",
    "url": "{{ biz.url }}"
  }

  {% else %}
  "@type": "WebPage",
  "name": "{{ page.title | default: site.title }}",
  "url": "{{ biz.url }}{{ page.url }}",
  "description": "{{ page.description | default: site.description | strip_html | strip_newlines }}",
  "isPartOf": {
    "@type": "WebSite",
    "name": "{{ biz.name }}",
    "url": "{{ biz.url }}"
  }
  {% endif %}
}
</script>

{% if type == "Article" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Accueil",
      "item": "{{ biz.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "UX",
      "item": "{{ biz.url }}/ux"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.short_title | default: page.title }}",
      "item": "{{ biz.url }}{{ clean_url }}"
    }
  ]
}
</script>
{% endif %}
