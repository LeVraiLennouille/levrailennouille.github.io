<div id="CursorDot"></div>
<div id="CursorBall"></div>
{%- assign cur = page.url | replace: "/index.html", "/" | replace: ".html", "" -%}
<nav class="NavBar" aria-label="Navigation principale">
    <a class="NavLogo CursorHover" href="/" aria-label="Retour à l'accueil">
        <img src="/assets/icon.svg" alt="Logo de Lennouille"/>
    </a>
    <button class="HamburgerBtn CursorHover" aria-label="Ouvrir le menu navigation" aria-expanded="false" aria-controls="NavMenu">
        <span class="HamburgerLines" aria-hidden="true"><span class="HamburgerLine"></span><span class="HamburgerLine"></span></span>
        <span class="HamburgerLabel">Menu</span>
    </button>
    <a class="NavContactBtn CursorHover" href="/contact">Contact</a>
    <div class="NavSide">
        <ul class="NavSocial">
            <li><a class="CursorHover" href="https://www.linkedin.com/in/lennygadroy" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3V9.75zm6.5 0h3.83v1.54h.06c.53-1 1.84-2.07 3.78-2.07 4.04 0 4.78 2.66 4.78 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.69V21h-4V9.75z"/></svg></a></li>
            <li><a class="CursorHover" href="https://www.instagram.com/lennygdr19" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.25-3.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/></svg></a></li>
            <li><a class="CursorHover" href="https://x.com/LennyGdr19" target="_blank" rel="noopener" aria-label="X (Twitter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.78L17.75 3zm-1.08 16.16h1.7L7.4 4.74H5.58l11.09 14.42z"/></svg></a></li>
        </ul>
        <button type="button" class="NavThemeBtn CursorHover" role="switch" aria-checked="false" aria-label="Mode sombre" data-theme-toggle>
            <svg class="IconMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="IconSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
    </div>
    <div class="NavMenu" id="NavMenu">
        <a class="NavMenuBrand CursorHover" href="/" aria-label="Lennouille, retour à l'accueil">
            <span class="Name">Lennouille</span>
            <span class="Tag">Designer <strong>UI/UX</strong> freelance</span>
        </a>
        <ul class="NavLinks CursorHover">
            <li><a href="/"{%- if cur == "/" %} aria-current="page"{%- endif %}><span class="LinkName">Accueil</span></a></li>
            <li><a href="/services"{%- if cur == "/services" %} aria-current="page"{%- endif %}><span class="LinkName">Services</span></a></li>
            <li><a href="/ux"{%- if cur == "/ux" or cur contains "/ux/" %} aria-current="page"{%- endif %}><span class="LinkName">UX</span></a></li>
            <li><a href="/reals"{%- if cur == "/reals" or cur contains "/reals/" %} aria-current="page"{%- endif %}><span class="LinkName">Portfolio</span></a></li>
            <li><a href="/blog"{%- if cur == "/blog" or cur contains "/blog/" %} aria-current="page"{%- endif %}><span class="LinkName">Articles</span></a></li>
            <li><a href="/about"{%- if cur == "/about" %} aria-current="page"{%- endif %}><span class="LinkName">À propos</span></a></li>
        </ul>
        <div class="NavCTA">
            <a class="NavPill CursorHover" href="/contact">Contactez-moi <span class="Dot" aria-hidden="true"></span></a>
            <button type="button" class="NavSearchBtn CursorHover" data-search-open aria-label="Rechercher sur le site" aria-haspopup="dialog" aria-expanded="false" title="Rechercher (Ctrl + K)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span class="NavSearchLabel">Rechercher sur le site</span>
            </button>
            <a class="SimBtn CursorHover" href="/LennSimu/" data-hover="de devis">Simulateur</a>
            <button type="button" class="NavThemeBtn NavThemeMobile CursorHover" role="switch" aria-checked="false" aria-label="Mode sombre" data-theme-toggle>
                <svg class="IconMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="IconSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
        </div>
    </div>
</nav>
<div class="SearchOverlay" id="SearchOverlay" role="dialog" aria-modal="true" aria-label="Rechercher sur le site" hidden>
    <div class="SearchBackdrop" data-search-close></div>
    <div class="SearchPanel">
        <form class="SearchField" role="search" action="#" onsubmit="return false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="SearchInput" type="search" name="q" placeholder="Rechercher une page, un article, une loi UX…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="SearchResults" aria-label="Rechercher sur le site">
            <button type="button" class="SearchClose CursorHover" data-search-close aria-label="Fermer la recherche">Esc</button>
        </form>
        <div class="SearchBody">
            <p class="SearchLabel" id="SearchLabel" hidden></p>
            <ul class="SearchResults" id="SearchResults" role="listbox" aria-label="Résultats de recherche"></ul>
            <p class="SearchStatus" id="SearchStatus" role="status" aria-live="polite"></p>
        </div>
        <div class="SearchFooter" aria-hidden="true">
            <span><kbd>↑</kbd><kbd>↓</kbd> Naviguer</span>
            <span><kbd>↵</kbd> Ouvrir</span>
            <span><kbd>Esc</kbd> Fermer</span>
        </div>
    </div>
</div>
