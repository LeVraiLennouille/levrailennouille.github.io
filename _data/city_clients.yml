# ==========================================================================
# Références affichées sur les pages villes  (include : city-clients.html)
#
# Clé       = slug de la page ville : poitiers, reims, paris
# name      = nom affiché
# logo      = chemin du logo (laisser "" : le nom s'affiche en texte)
# services  = ce que j'ai fait (une pastille par élément)
# url       = lien vers l'étude de cas (laisser "" : pas de lien)
# kind      = précision affichée sur la carte (Client, Projet personnel…) — d'après le champ « Contexte » de la page projet
# relation  = client | projet | partenaire (sert au lien « Réalisé pour… » sur les pages projet)
# metric    = chiffre clé affiché sur la carte : {value: "+24 %", label: "taux de conversion"}
#
# Une ville sans entrée (ou liste vide) n'affiche aucune section.
# L'ordre de la liste = l'ordre d'affichage.
# ==========================================================================

