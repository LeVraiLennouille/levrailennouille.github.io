<!DOCTYPE html>
<html lang="fr">
<head>
    {%- assign biz = site.data.business -%}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | escape }}</title>

    <meta name="description" content="{{ page.description | escape }}">
    <meta name="author" content="Lenny Gadroy">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ biz.url }}/ux/laws/{{ page.law_slug }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:image" content="{{ biz.url }}/assets/og-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Lennouille">
    <meta property="article:author" content="Lenny Gadroy">
    <meta property="article:section" content="{{ page.section | escape }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | escape }}">
    <meta name="twitter:image" content="{{ biz.url }}/assets/og-preview.png">
    <meta name="twitter:site" content="@LennyGdr19">
    <meta name="twitter:creator" content="@LennyGdr19">

    <link rel="canonical" href="{{ biz.url }}/ux/laws/{{ page.law_slug }}">
    <meta name="theme-color" content="#1c1c1e">
    {% include theme-init.html %}
    <link href="/style.css" rel="stylesheet">
    <link href="/ux/laws/laws.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
    {%- assign page_url = biz.url | append: "/ux/laws/" | append: page.law_slug | append: "/" -%}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "{{ page.schema_type | default: 'Article' }}",
          "@id": "{{ page_url }}#article",
          "headline": {{ page.short_title | default: page.title | jsonify }},
          "name": {{ page.title | jsonify }},
          "url": "{{ page_url }}",
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{ page_url }}"
          },
          "description": {{ page.description | jsonify }},
          "inLanguage": "fr-FR",
          {%- if page.date %}
          "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
          {%- endif %}
          {%- if page.last_modified_at %}
          "dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }},
          {%- endif %}
          "articleSection": {{ page.section | jsonify }},
          "image": "{{ biz.url }}{{ page.image | default: '/assets/og-preview.png' }}",
          "author": {
            "@type": "Person",
            "@id": "{{ biz.url }}/#lenny-gadroy",
            "name": "Lenny Gadroy"
          },
          "publisher": {
            "@type": "Organization",
            "@id": "{{ biz.url }}/#organization",
            "name": {{ biz.name | jsonify }},
            "url": "{{ biz.url }}",
            "logo": {
              "@type": "ImageObject",
              "url": "{{ biz.url }}{{ biz.logo }}"
            }
          },
          "isPartOf": {
            "@type": "WebSite",
            "@id": "{{ biz.url }}/#website",
            "name": {{ biz.name | jsonify }},
            "url": "{{ biz.url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Accueil",
              "item": "{{ biz.url }}/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "UX",
              "item": "{{ biz.url }}/ux"
            },
            {
              "@type": "ListItem",
              "position": 3,
              "name": {{ page.short_title | jsonify }},
              "item": "{{ page_url }}"
            }
          ]
        }
      ]
    }
    </script>
</head>
<body>
    <main class="UX SubPage" id="top">
        {% include header.html %}
        {{ content }}
        {% include footer.html %}
    </main>
<!-- Anims -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!-- Scripts -->
    <script src="/script.js"></script>
    <script src="/anims.js" defer></script>
</body>
</html>
